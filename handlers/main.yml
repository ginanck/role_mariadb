---
- name: restart mariadb
  ansible.builtin.systemd:
    name: "{{ mariadb_service_name }}"
    state: restarted
    daemon_reload: true

- name: reload mariadb
  ansible.builtin.systemd:
    name: "{{ mariadb_service_name }}"
    state: reloaded

- name: stop mariadb
  ansible.builtin.systemd:
    name: "{{ mariadb_service_name }}"
    state: stopped
